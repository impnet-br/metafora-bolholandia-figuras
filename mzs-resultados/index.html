*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
     background:var(--fundo);color:var(--carvao);padding:1.5rem;

p.sub{margin:0 0 1.8rem;color:#5b5b5b;font-size:.92rem}
.opcoes{display:grid;gap:.75rem}
a.op{display:flex;align-items:center;gap:.8rem;padding:.95rem 1.15rem;
     background:var(--branco);border:1px solid var(--azul);border-radius:var(--raio);
     text-decoration:none;color:var(--carvao);
     box-shadow:0 1px 2px rgba(45,45,45,.06),0 4px 16px rgba(45,45,45,.06);
     transition:border-color .15s ease,transform .15s ease}
a.op:hover,a.op:focus-visible{border-color:var(--indigo);transform:translateY(-1px)}
a.op svg{width:30px;height:21px;border-radius:3px;flex:0 0 auto}
a.op b{display:block;font-size:1rem;color:var(--indigo)}
a.op span{display:block;font-size:.85rem;color:#5b5b5b}
footer{margin:1.8rem 0 0;font-size:.8rem;color:#6a6a6a}
footer a{color:var(--indigo)}
